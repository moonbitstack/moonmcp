name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: stdio example answers
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | moon run src/examples/03-stdio --target native | grep -q '"name":"add"'

      - name: generated annotations are fresh
        shell: bash
        run: |
          moon run src/cmd/mcp --target native -- -C . src/examples/01-annotations/tools.mbt -o src/examples/01-annotations/tools.g.mbt --check
          moon run src/cmd/mcp --target native -- -C . src/examples/guide/ann/tools.mbt -o src/examples/guide/ann/tools.g.mbt --check

      - name: annotations example answers
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"greet","arguments":{"name":"leo","language":"zh"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | moon run src/examples/01-annotations --target native | grep -q 'leo'

      - name: the three ways of writing a server answer the same
        shell: bash
        run: moon run src/examples/guide/check --target native | grep -q '^\[same\] true'

      - name: the guide is what its packages write
        run: python3 scripts/gen_guide.py --check

      - name: extension example answers
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | moon run src/examples/05-extensions --target native | grep -q '"name":"bench_add"'

      - name: the documentation page is served beside the endpoint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (cd integration && moon run src/02-http --target native) & server=$!
          curl -sS --retry 60 --retry-connrefused --retry-delay 1 \
            -o "$RUNNER_TEMP/debug-page.html" http://127.0.0.1:12000/docs
          grep -q 'moonmcp' "$RUNNER_TEMP/debug-page.html"
          grep -q '{"endpoint":"/mcp"}' "$RUNNER_TEMP/debug-page.html"
          curl -sS -o "$RUNNER_TEMP/debug-reply.json" -X POST http://127.0.0.1:12000/mcp \
            -H 'content-type: application/json' \
            -H 'mcp-protocol-version: 2026-07-28' \
            -H 'mcp-method: tools/list' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}'
          grep -q '"name":"add"' "$RUNNER_TEMP/debug-reply.json"
          kill $server

      - name: documentation blocks compile
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      - name: the ecosystem module checks and tests
        run: |
          cd integration
          moon check --target native --deny-warn
          moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install the interoperability packages
        run: npm install --prefix scripts/interop --no-audit --no-fund

      - name: build the two servers and the clients
        run: |
          moon build src/examples/03-stdio --target native
          moon build src/examples/06-interop --target native
          moon build src/examples/08-conformance-client --target native
          cd integration && moon build src/02-http --target native

      - name: the official conformance suite, server side
        run: sh scripts/interop/check_conformance.sh

      - name: the official conformance suite, client side
        run: sh scripts/interop/check_client_conformance.sh

      - name: the typescript sdk and the inspector, both ways
        run: |
          node scripts/interop/run.mjs \
            --stdio _build/native/debug/build/examples/03-stdio/03-stdio \
            --http integration/_build/native/debug/build/moonbitstack/moonmcp-ecosystem/02-http/02-http \
            --client _build/native/debug/build/examples/06-interop/06-interop
