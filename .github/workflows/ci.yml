name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: stdio example answers
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | moon run src/examples/stdio --target native | grep -q '"name":"add"'

      - name: generated annotations are fresh
        run: moon run src/cmd/mcp --target native -- -C . src/examples/annotations/tools.mbt -o src/examples/annotations/tools.g.mbt --check

      - name: annotations example answers
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"greet","arguments":{"name":"leo","language":"zh"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | moon run src/examples/annotations --target native | grep -q 'leo'

      - name: debug page is served beside the endpoint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon run src/examples/http --target native & server=$!
          curl -sS --retry 60 --retry-connrefused --retry-delay 1 \
            -o "$RUNNER_TEMP/debug-page.html" http://127.0.0.1:12000/debug
          grep -q 'moonmcp' "$RUNNER_TEMP/debug-page.html"
          grep -q '{"endpoint":"/mcp"}' "$RUNNER_TEMP/debug-page.html"
          curl -sS -o "$RUNNER_TEMP/debug-reply.json" -X POST http://127.0.0.1:12000/mcp \
            -H 'content-type: application/json' \
            -H 'mcp-protocol-version: 2026-07-28' \
            -H 'mcp-method: tools/list' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}'
          grep -q '"name":"add"' "$RUNNER_TEMP/debug-reply.json"
          kill $server

      - name: documentation blocks compile
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py

      - name: lint (fmt is clean)
        run: |
          moon fmt && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git -c core.autocrlf=false diff --ignore-cr-at-eol --exit-code
